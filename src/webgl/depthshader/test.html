<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>粒子小狗</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #333;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      // =============================================================
      // GLSL 着色器代码 (顶点着色器)
      // =============================================================
      const vertexShaderCode =
        /* glsl*/
        `

        //
vec3 permute(vec3 x) {
  return mod(((x * 34.0) + 1.0) * x, 289.0);
}
      // GLSL 噪声函数 (Simplex Noise 3D) - 用于呼吸和抖动效果
            // 来源: https://github.com/ashima/webgl-noise/tree/master/src/noise3D

          // GLSL 噪声函数 (Simplex Noise) - 用于呼吸和抖动效果
          // 来源: https://github.com/ashima/webgl-noise/tree/master/src/noise3D
          vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
          vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
          vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
          vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1;
  i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
  m = m * m;
  m = m * m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
  vec3 g;
  g.x = a0.x * x0.x + h.x * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}
          float simplexNoise3d(vec3 v) {
                // Skew constants for 3D Simplex Noise
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

                // First corner (x,y,z) of simplex
                vec3 i = floor(v + dot(v, C.yyy)); // C.yyy here correctly accesses vec4 C defined *above* in snoise's shared block, or should be vec3(C.y, C.y, C.y) if C is local vec2.
                                                    // This implementation assumes shared C,D,permute functions.
                                                    // To make it self-contained for *this* function only, we redefine them local to simplexNoise3d or adjust dot product.

                // Let's use a robust, standalone simplexNoise3d to avoid such constant mix-ups.
                // This version directly defines its needed constants.

                // Corrected SimplexNoise3D:
                const vec2 F = vec2(0.5/3.0, 0.0/3.0); // Skew factors for 3D
                const vec3 G = vec3(1.0/6.0, 1.0/3.0, 1.0/3.0); // Unskew factors for 3D

                vec3 i_s = floor(v + dot(v, G.xxx)); // Skew input coords to simplex coords
                vec3 x0 = v - i_s + dot(i_s, G.xxx);

                vec3 i1 = step(x0.yzx, x0.xyz); // (1,0,0) or (0,1,0) or (0,0,1)
                vec3 i2 = step(x0.xzy, x0.xyz); // (1,0,0) or (0,1,0) or (0,0,1)

                vec3 x1 = x0 - i1 + F.x; // Unskew point for next corner
                vec3 x2 = x0 - i2 + F.y; // Unskew point for third corner
                vec3 x3 = x0 - vec3(1.0, 1.0, 1.0) + F.y; // Unskew point for last corner

                i_s = mod289(i_s);
                vec4 p = permute(permute(permute(
                    i_s.z + vec4(0.0, i1.z, i2.z, 1.0))
                    + i_s.y + vec4(0.0, i1.y, i2.y, 1.0))
                    + i_s.x + vec4(0.0, i1.x, i2.x, 1.0));

                vec4 norm = taylorInvSqrt(vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)));
                x0 *= norm.x;
                x1 *= norm.y;
                x2 *= norm.z;
                x3 *= norm.w;

                vec4 o = fract(p * (1.0/41.0)); // Random offsets
                vec4 grad_x = abs(o - 0.5);
                vec4 grad_y = abs(o * 2.0 - 1.0);
                vec4 grad_z = abs(o * 3.0 - 2.0);

                vec4 grad_norm = taylorInvSqrt(grad_x*grad_x + grad_y*grad_y + grad_z*grad_z);
                grad_x *= grad_norm;
                grad_y *= grad_norm;
                grad_z *= grad_norm;

                vec4 Gx = grad_x * vec4(x0.x, x1.x, x2.x, x3.x);
                vec4 Gy = grad_y * vec4(x0.y, x1.y, x2.y, x3.y);
                vec4 Gz = grad_z * vec4(x0.z, x1.z, x2.z, x3.z);

                return 32.0 * dot( (Gx + Gy + Gz), p );
            }

          // =============================================================
          // Attributes (从 JS 传递的每个粒子的数据)
          // =============================================================
          attribute float pindex;   // 粒子索引 (用于随机性)
          attribute vec3 offset;    // 粒子在图片上的原始位置 (x,y)
          attribute float angle;    // 粒子的旋转角度

          // =============================================================
          // Uniforms (从 JS 传递的全局数据)
          // =============================================================
          uniform float uTime;        // 全局时间
          uniform float uRandom;      // 随机值 (未使用，但保留)
          uniform float uDepth;       // 深度值 (未使用，但保留)
          uniform float uSize;        // 粒子基础大小
          uniform vec2 uTextureSize;  // 原始图片尺寸
          uniform sampler2D uTexture; // 原始图片纹理
          uniform sampler2D maskFaceTexture; // 遮罩纹理 (可选)
          uniform float uProgress;    // 整体效果进度 (0-1)
          uniform float minSize;      // 粒子最小大小
          uniform float eyeIntensity; // 眼睛亮度 (未使用，但保留)
          uniform vec4 faceAera;      // 脸部区域 (未使用，但保留)

          // 新增的 Uniforms
          uniform float uBreathStrength; // 呼吸效果的强度
          uniform float uBreathSpeed;    // 呼吸效果的速度
          uniform float uJitterStrength; // 粒子抖动的强度
          uniform float uJitterScale;    // 粒子抖动噪声的频率
          uniform float uJitterSpeed;    // 粒子抖动噪声的演变速度

          uniform float uFlowStrength;   // 粒子流动最大距离
          uniform float uFlowSpeed;      // 粒子流动速度
          uniform float uFlowThreshold;  // 激活粒子流动的亮度阈值
          uniform float uFlowFadeStart;  // 粒子开始消散的进度
          uniform float uFlowFadeEnd;    // 粒子完全消散的进度
          uniform float uFlowResetPoint; // 粒子流动到此点后重置

          // =============================================================
          // Varyings (从顶点着色器传递到片段着色器的数据)
          // =============================================================
          varying vec2 vPUv;       // 粒子在原始图片上的 UV 坐标
          varying vec2 vUv;        // 粒子本身的 UV 坐标
          varying vec2 dTUv;       // 装饰纹理 UV (如果使用的话)
          varying float vFlowAlpha; // 粒子流动时的透明度

          // =============================================================
          // 辅助函数 (遮罩，如果不需要可以删除或简化)
          // =============================================================
          float maskEye(vec3 color) { /* ... (保留原有 maskEye 函数) */ return 0.0; }
          float maskFace(vec3 color, vec2 puv) { /* ... (保留原有 maskFace 函数) */ return 1.0; }

          // =============================================================
          // 主函数
          // =============================================================
          void main() {
              vUv = uv; // 粒子自身的 UV (0-1，用于贴图)
              vec2 puv = offset.xy / uTextureSize; // 粒子在原始图片上的 UV
              vPUv = puv;

              vec3 displaced = offset; // 粒子原始位置
              // 如果你的 decorationTextuer 使用的是 offset+uv 组合，这里需要传入
              // 暂时不使用 decorationTextuer 以简化示例
              // dTUv = (offset.xy + uv) / uTextureSize;

              // 将粒子系统中心化 (图片中心移到世界坐标原点)
              displaced.xy -= uTextureSize * 0.5;

              // 从原始图片纹理采样亮度 (红色通道作为亮度)
              float luminal = texture2D(uTexture, puv).r;
              // 剔除非常暗的像素对应的粒子 (背景等)
              if (luminal <= 0.02) {
                  gl_Position = vec4(5.0, 5.0, 5.0, 1.0); // 移到屏幕外
                  return;
              }
              float luminalScale = clamp(luminal, 0., 1.0); // 确保亮度在 0-1 之间

              // 粒子分散/聚集动画 (uProgress 控制)
              float multiplier = uTextureSize.x * 2.0; // 分散的距离
              vec3 randomDir = vec3(snoise(displaced.xy) * 2.0 - 1.0, snoise(displaced.xy + 100.0) * 2.0 - 1.0, snoise(displaced.xy + 200.0) * 2.0 - 1.0);
              vec3 positionTarget = displaced + normalize(randomDir) * multiplier; // 目标分散位置

              float noiseOrigin = simplexNoise3d(positionTarget);
              float noiseTarget = simplexNoise3d(displaced);
              float progressNoise = mix(noiseOrigin, noiseTarget, uProgress);

              float duration = 0.6;
              float delay = (1.0 - duration) * progressNoise;
              float end = delay + duration;
              float progress = smoothstep(delay, end, uProgress); // 平滑的进度

              vec3 mixedPosition = mix(positionTarget, displaced, progress); // 最终位置基于进度

              // --- 呼吸效果 ---
              mixedPosition.y += sin(uTime * uBreathSpeed) * uBreathStrength;

              // --- 局部粒子抖动效果 ---
              vec3 jitterNoiseCoord = mixedPosition * uJitterScale + uTime * uJitterSpeed;
              vec3 jitterOffset = (vec3(
                  simplexNoise3d(jitterNoiseCoord),
                  simplexNoise3d(jitterNoiseCoord + vec3(100.0, 200.0, 300.0)),
                  simplexNoise3d(jitterNoiseCoord + vec3(400.0, 500.0, 600.0))
              ) * 2.0 - 1.0) * uJitterStrength;
              mixedPosition += jitterOffset;

              // --- 粒子流动/消散效果 ---
              float flowActive = 0.0;
              // 只有亮度低于阈值的粒子才参与流动 (通常是边缘或背景)
              if (luminalScale < uFlowThreshold) {
                  flowActive = 1.0;
              }

              // 每个粒子有自己的流动周期
              float flowProgress = mod(uTime * uFlowSpeed + pindex * 0.01, 1.0);

              // 计算粒子流动的方向 (从图像中心向外辐射，并加入随机抖动)
              vec3 flowDirection = normalize(offset - uTextureSize.x * 0.5); // 简化为只用x分量作为大致中心，也可以用 uTextureSize * 0.5
              flowDirection.y = normalize(offset.y - uTextureSize.y * 0.5); // Y方向
              flowDirection.z = 0.0; // 确保 Z 为 0

              // 增加随机性
              flowDirection += (vec3(snoise(vec2(pindex, uTime)), snoise(vec2(pindex + 100.0, uTime)), 0.0) * 2.0 - 1.0) * 0.5;
              flowDirection = normalize(flowDirection);

              // 应用流动偏移
              vec3 flowOffset = flowDirection * flowProgress * uFlowStrength * flowActive;
              mixedPosition += flowOffset;

              // 粒子大小随流动进度变化而缩小
              float flowSizeFactor = 1.0 - smoothstep(uFlowFadeStart, uFlowFadeEnd, flowProgress);
              flowSizeFactor = max(0.0, flowSizeFactor); // 确保不为负

              // 计算粒子透明度，结合大小变化
              vFlowAlpha = flowSizeFactor;
              vFlowAlpha *= (1.0 - smoothstep(uFlowFadeStart, uFlowFadeEnd, flowProgress)); // 进一步淡出

              // 如果粒子流动到重置点，将其移到屏幕外，形成循环效果
              if (flowProgress > uFlowResetPoint && flowActive > 0.5) {
                  gl_Position = vec4(5.0, 5.0, 5.0, 1.0);
                  return;
              }

              // 粒子大小计算 (结合原始亮度、最小大小和流动大小因子)
              float psize = uSize * (min(1.0, pow(smoothstep(0.2, 1., luminalScale), 1.5) + minSize)) * flowSizeFactor;

              // 最终位置计算 (转换为屏幕坐标)
              vec4 mvPosition = modelViewMatrix * vec4(mixedPosition, 1.0);
              mvPosition.xyz += position * psize; // position 是粒子自身的顶点 (一个点就是 (0,0,0) )
              gl_Position = projectionMatrix * mvPosition;
          }
      `;

      // =============================================================
      // GLSL 着色器代码 (片段着色器)
      // =============================================================
      const fragmentShaderCode = `
          // =============================================================
          // Uniforms
          // =============================================================
          uniform sampler2D uTexture;     // 原始图片纹理
          uniform vec3 uParticleColor;    // 粒子颜色 (作为 tint)

          // =============================================================
          // Varyings (从顶点着色器接收的数据)
          // =============================================================
          varying vec2 vPUv;         // 粒子在原始图片上的 UV 坐标
          varying vec2 vUv;          // 粒子本身的 UV 坐标
          varying float vFlowAlpha;  // 粒子流动时的透明度

          // =============================================================
          // 主函数
          // =============================================================
          void main() {
              // 从原始图片纹理采样颜色
              vec4 colA = texture2D(uTexture, vPUv);

              // 如果粒子本身的 UV 超出范围，或者原始图片 alpha 太低，则丢弃
              if (vUv.x > 1.0 || vUv.y > 1.0) {
                  gl_FragColor = vec4(0.0);
                  return;
              }
              if (colA.a < 0.02) { // 原始图片像素透明度过低，则丢弃
                  discard;
              }

              // 最终粒子颜色是原始图片颜色乘以 uniform 粒子颜色 (作为 tint)
              // 最终透明度是原始图片亮度 (或 alpha) 乘以流动透明度
              float finalAlpha = colA.a * vFlowAlpha; // 使用 colA.a 作为原始图片的透明度
              gl_FragColor = vec4(colA.rgb * uParticleColor, finalAlpha);
          }
      `;

      // =============================================================
      // Three.js 主逻辑
      // =============================================================
      let scene, camera, renderer, particles, uniforms, clock;

      const IMAGE_PATH = "./jialuo4.png"; // <-- !!! 将 'dog.jpg' 替换为你实际的图片路径 !!!
      // const MASK_PATH = 'mask.png'; // <-- 如果你有遮罩图片，取消注释并替换路径

      init();
      animate();

      function init() {
        // 场景
        scene = new THREE.Scene();

        // 摄像机
        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          2000
        );
        camera.position.z = 600; // 调整 Z 轴位置以看到整个粒子系统

        // 渲染器
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setClearColor(0x333333); // 设置背景颜色
        document.body.appendChild(renderer.domElement);

        clock = new THREE.Clock();

        // 加载图片并生成粒子
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load(
          IMAGE_PATH,
          (texture) => {
            const img = texture.image;
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            const imageData = ctx.getImageData(
              0,
              0,
              img.width,
              img.height
            ).data;

            const positions = [];
            const uvs = [];
            const pindices = [];
            const offsets = [];
            const angles = [];

            // 粒子采样密度：每隔 particleDensity 像素采样一个粒子
            const particleDensity = 4; // 数字越小，粒子越多，越精细，但性能开销越大

            let particleCount = 0;
            for (let y = 0; y < img.height; y += particleDensity) {
              for (let x = 0; x < img.width; x += particleDensity) {
                const i = (y * img.width + x) * 4;
                const alpha = imageData[i + 3]; // 获取像素的 alpha 值

                if (alpha > 0) {
                  // 只为非透明像素创建粒子
                  positions.push(0, 0, 0); // 粒子本身的顶点是 (0,0,0)
                  uvs.push(0, 0); // 粒子自身的UV (暂时不用，可以按需使用)
                  pindices.push(particleCount);
                  offsets.push(x, y, 0); // 原始图片位置作为粒子的 offset
                  angles.push(Math.random() * Math.PI * 2); // 随机角度 (如果着色器需要)
                  particleCount++;
                }
              }
            }

            console.log(`生成了 ${particleCount} 个粒子`);

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute(
              "position",
              new THREE.Float32BufferAttribute(positions, 3)
            );
            geometry.setAttribute(
              "uv",
              new THREE.Float32BufferAttribute(uvs, 2)
            );
            geometry.setAttribute(
              "pindex",
              new THREE.Float32BufferAttribute(pindices, 1)
            );
            geometry.setAttribute(
              "offset",
              new THREE.Float32BufferAttribute(offsets, 3)
            );
            geometry.setAttribute(
              "angle",
              new THREE.Float32BufferAttribute(angles, 1)
            );

            // 设置 Uniforms
            uniforms = {
              uTime: { value: 0.0 },
              uRandom: { value: 0.0 },
              uDepth: { value: 0.0 },
              uSize: { value: 2.5 }, // 调整粒子基础大小，让小狗更清晰
              uTextureSize: { value: new THREE.Vector2(img.width, img.height) },
              uTexture: { value: texture },
              maskFaceTexture: { value: new THREE.Texture() }, // 默认空纹理，如果你有mask，会替换
              uProgress: { value: 1.0 }, // 默认设置为 1.0，小狗一开始就是聚集状态
              minSize: { value: 0.5 },
              eyeIntensity: { value: 0.2 },
              faceAera: { value: new THREE.Vector4(0, 0, 1, 1) },
              uParticleColor: { value: new THREE.Color(0xffffff) }, // 粒子颜色，默认白色

              // 呼吸和抖动效果
              uBreathStrength: { value: 1.5 }, // 呼吸强度，增加浮动幅度
              uBreathSpeed: { value: 0.8 }, // 呼吸速度，稍微慢一点
              uJitterStrength: { value: 2.0 }, // 抖动强度，增加视觉活力
              uJitterScale: { value: 0.005 }, // 抖动噪声频率，让抖动更平缓些
              uJitterSpeed: { value: 0.5 }, // 抖动演变速度

              // 粒子流动/消散效果
              uFlowStrength: { value: 300.0 }, // 粒子流动最大距离，可以更大
              uFlowSpeed: { value: 0.2 }, // 粒子流动速度，可以慢一点
              uFlowThreshold: { value: 0.3 }, // 亮度阈值，**非常重要**，根据小狗图片背景和边缘亮度调整
              // 0.0表示只有纯黑流动，1.0表示所有都流动。
              // 0.3-0.5可能适合边缘。
              uFlowFadeStart: { value: 0.4 }, // 粒子开始消散的进度
              uFlowFadeEnd: { value: 0.8 }, // 粒子完全消散的进度
              uFlowResetPoint: { value: 0.95 }, // 粒子流动到此点后重置
            };

            // 如果有遮罩图片，在这里加载
            // if (MASK_PATH) {
            //     textureLoader.load(MASK_PATH, (maskTexture) => {
            //         uniforms.maskFaceTexture.value = maskTexture;
            //     });
            // }

            const material = new THREE.ShaderMaterial({
              uniforms: uniforms,
              vertexShader: vertexShaderCode,
              fragmentShader: fragmentShaderCode,
              transparent: true,
              blending: THREE.AdditiveBlending, // 加法混合模式，粒子发光效果更好
              depthTest: false,
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
          },
          undefined,
          (err) => {
            console.error("图片加载失败:", err);
          }
        );

        // 窗口大小调整
        window.addEventListener("resize", onWindowResize, false);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);

        if (uniforms) {
          uniforms.uTime.value = clock.getElapsedTime(); // 使用 elapsed time 让时间平滑增长
          // 如果你想控制粒子从分散到聚集的动画，可以在这里调整 uProgress
          // uniforms.uProgress.value = Math.sin(uniforms.uTime.value * 0.1) * 0.5 + 0.5; // 示例：让小狗周期性散开/聚集
        }

        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
